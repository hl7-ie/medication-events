# IE Medication Events: Irish ePrescription, eDispensation, administration and medication statements.
# Proof of concept; not affiliated with, or endorsed by, HIQA, the HSE, HL7 Ireland, HL7 Europe or the Department of
# Health. The package id and canonical follow ADR-001 (the `hl7.*` package prefix is reserved for HL7).
id: nostalgic-ie.fhir.medication-events
canonical: https://hl7-ie.github.io/medication-events/fhir
name: IEMpd
title: IE Medication Events Implementation Guide
description: >-
  Irish ePrescription, eDispensation, medication administration and medication statement profiles aligned with the
  HIQA Draft National Standard for Electronic Prescriptions and Electronic Dispensations (September 2026). Proof of
  concept by Nithin Mohan; not affiliated with, or endorsed by, HIQA, the HSE, HL7 Ireland, HL7 Europe or the
  Department of Health. Not for clinical use.
status: draft
version: 0.1.0
releaseLabel: Nostalgic IE (draft)
fhirVersion: 4.0.1
copyrightYear: 2026+
license: CC0-1.0
jurisdiction: urn:iso:std:iso:3166#IE "Ireland"
publisher:
  name: Nithin Mohan (proof of concept)
  url: https://github.com/hl7-ie/medication-events
contact:
  - name: Nithin Mohan
    telecom:
      - system: url
        value: https://github.com/hl7-ie/medication-events

dependencies:
  hl7.fhir.uv.extensions.r4: 5.1.0
  # SUSHI cross-version support: R5 extensions used by HL7 Europe MPD (e.g. extension-MedicationDispense.recorded)
  hl7.fhir.extensions.r5: 4.0.1
  hl7.fhir.eu.base:
    id: hl7fhireubase
    uri: http://hl7.eu/fhir/base/ImplementationGuide/hl7.fhir.eu.base
    version: 2.0.0
  hl7.fhir.eu.extensions.r4:
    id: hl7fhireuextr4
    uri: http://hl7.eu/fhir/extensions/ImplementationGuide/hl7.fhir.eu.extensions.r4
    version: 1.3.0
  # HL7 Europe MPD 1.0.0: parent of the ePrescription and eDispensation profiles (IE Core ADR-003)
  hl7.fhir.eu.mpd:
    id: hl7fhireuropempd
    uri: http://hl7.eu/fhir/mpd/ImplementationGuide/hl7.fhir.eu.mpd
    version: 1.0.0
  ihe.pharm.mpd.r4:
    id: ihepharmmpdr4
    uri: https://profiles.ihe.net/PHARM/MPD/ImplementationGuide/ihe.pharm.mpd
    version: 1.0.0-comment-2

parameters:
  apply-jurisdiction: true
  apply-publisher: true
  apply-contact: true
  apply-version: true
  usage-stats-opt-out: true
  excludettl: true
  excludemap: true
  pin-canonicals: pin-all

pages:
  index.md:
    title: Home
  hiqa-alignment.md:
    title: HIQA Alignment
  hiqa-traceability.md:
    title: HIQA Traceability
  data-minimisation.md:
    title: Data Minimisation
  administration-and-statements.md:
    title: Administration and Statements
  terminology.md:
    title: Terminology
  open-issues.md:
    title: Open Issues
  simplifier-publishing.md:
    title: Simplifier Publishing
  crossborder-eprescription.md:
    title: Cross-Border ePrescription (reference examples)
    crossborder-patient-profile.md:
      title: Patient Profile & Scenarios (reference)
    crossborder-sample-payloads.md:
      title: Sample Payloads & Downloads (reference)
  irish-legislation.md:
    title: Irish ePrescription Legislation (reference)
  changes.md:
    title: Changes
  downloads.md:
    title: Downloads

menu:
