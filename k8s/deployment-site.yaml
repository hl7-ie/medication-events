apiVersion: apps/v1
kind: Deployment
metadata:
  name: ie-mpd-site
  labels:
    app.kubernetes.io/name: ie-mpd-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ie-mpd-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ie-mpd-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ie-mpd-site
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
