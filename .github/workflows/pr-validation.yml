name: PR Validation

# Quality gates for every pull request. Modelled on IE Core's pr-validation.yml.
# Actions are pinned to commit SHAs (Dependabot keeps them current); tools are pinned to exact versions and the
# downloaded jars are checked against their SHA-256. Every job has read-only permissions.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  SUSHI_VERSION: 3.18.0
  PUBLISHER_VERSION: 2.3.4
  PUBLISHER_SHA256: 970922c12eb583bfb4cb6121584b922a236d5904e36413e3545d2fbc248f8e2b
  VALIDATOR_VERSION: 6.10.4
  VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
  JEKYLL_VERSION: 4.4.1
  NODE_VERSION: '24'  # @cucumber/cucumber 13 needs Node 22, 24 or >=26
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'

jobs:
  sushi:
    name: SUSHI (0 errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Install SUSHI ${{ env.SUSHI_VERSION }}
        run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Run SUSHI (fail on any error)
        run: |
          sushi . | tee sushi.log
          grep -Eq '\b0 Errors\b' sushi.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsh-generated
          path: fsh-generated/
          retention-days: 3

  tests:
    name: BDD, HIQA traceability and data-minimisation guard
    needs: sushi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated
          path: fsh-generated/
      - name: FHIR packages (parent profiles for the mapping check)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          fail-on-cache-miss: true
      - run: npm ci
        working-directory: tests
      - name: BDD
        run: npm run test:bdd
        working-directory: tests
      - name: HIQA traceability matrix is current
        run: python scripts/hiqa/generate_traceability.py --check
      - name: HIQA mapping agrees with the profiles
        run: python scripts/hiqa/check_mapping_against_snapshots.py
      - name: ePrescription data-minimisation guard
        run: python scripts/qa/check_ep_data_minimisation.py
      - name: Open-issues page is in sync
        run: python scripts/hiqa/sync_open_issues.py --check
      - name: Page links resolve to artefacts
        run: python scripts/qa/check_page_links.py
      - name: Simplifier.net bundle builds (package id, dependencies, canonical)
        run: python scripts/simplifier/build_bundle.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simplifier-bundle
          path: build/simplifier-upload.zip
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports
          path: tests/reports/
          retention-days: 7

  terminology:
    name: Every explicit code exists and is active (tx.fhir.org; NMPC via the verified list)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify codes
        run: |
          python scripts/terminology/verify_codes.py | tee verify.log
          grep -Eq ' 0 not found, errored or inactive$' verify.log

  validator:
    name: FHIR Validator (examples pass; QA not above baseline)
    needs: sushi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated
          path: fsh-generated/
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Cache validator ${{ env.VALIDATOR_VERSION }}
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/validator/validator_cli.jar
          key: validator-${{ env.VALIDATOR_VERSION }}
      - name: Download validator ${{ env.VALIDATOR_VERSION }}
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o tests/validator/validator_cli.jar "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
      - name: Check validator checksum
        run: echo "${VALIDATOR_SHA256}  tests/validator/validator_cli.jar" | sha256sum -c -
      - run: npm ci
        working-directory: tests
      - name: Validate every example (codes checked on tx.fhir.org)
        working-directory: tests
        run: node validator/run-validation.js --tx
      - name: Whole-IG validator QA not above baseline
        run: |
          python scripts/qa/validate_all.py . tests/validator/validator_cli.jar qa.json
          python scripts/qa/qa_gate.py qa.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-report
          path: |
            tests/reports/validation-results.json
            qa.json
          retention-days: 7

  container:
    name: Docker image and Kubernetes manifests (local test tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the self-contained ci image (tool checksums verified in the build)
        run: docker build --target ci -t ie-mpd-ci:ci .
      - name: Run the test gates inside the image
        run: docker run --rm ie-mpd-ci:ci test
      - name: Render the Kubernetes manifests
        run: kubectl kustomize k8s/ > /dev/null

  ig-publisher:
    name: IG Publisher (QA report)
    needs: sushi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      - name: Install Jekyll ${{ env.JEKYLL_VERSION }}
        run: gem install jekyll -v "${JEKYLL_VERSION}" --no-document
      - name: Install SUSHI ${{ env.SUSHI_VERSION }}
        run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Download IG Publisher ${{ env.PUBLISHER_VERSION }}
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | sha256sum -c -
      - name: Run IG Publisher
        run: java -Xmx6g -Dfile.encoding=UTF-8 -jar input-cache/publisher.jar -ig .
      - name: QA summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = 'output/qa.json'
          if not os.path.exists(p):
              print('## IG Publisher QA\n\nNo qa.json produced.')
          else:
              d = json.load(open(p, encoding='utf-8'))
              print('## IG Publisher QA\n')
              print(f"- Errors: {d.get('errs')}\n- Warnings: {d.get('warnings')}\n- Hints: {d.get('hints')}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ig-qa
          path: |
            output/qa.html
            output/qa.json
            output/qa.txt
          retention-days: 7
